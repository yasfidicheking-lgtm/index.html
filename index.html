<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة التلميذ - مشروع مدرسي</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- صفحة تسجيل الدخول -->
  <div id="login-page" class="page">
    <div class="login-box">
      <div class="logo">بوابة التلميذ</div>
      <p class="subtitle">مشروع مدرسي - غير رسمي</p>

      <form id="login-form">
        <div class="form-group">
          <label>اسم المستخدم</label>
          <input type="text" id="username" placeholder="مثال: student01" required>
        </div>
        <div class="form-group">
          <label>كلمة المرور</label>
          <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
        </div>
        <button type="submit" class="btn">تسجيل الدخول</button>
      </form>

      <p class="hint">للتجربة: username = <b>eleve</b> | password = <b>1234</b></p>
    </div>
  </div>

  <!-- لوحة التحكم -->
  <div id="dashboard" class="page hidden">
    <header class="header">
      <div class="header-right">
        <span class="student-name" id="student-name">أحمد بن علي</span>
        <button id="logout-btn" class="btn-logout">خروج</button>
      </div>
      <div class="header-left">بوابة التلميذ</div>
    </header>

    <div class="container">
      <!-- بطاقة المعلومات -->
      <div class="card info-card">
        <h2>معلومات التلميذ</h2>
        <div class="info-grid">
          <div><span>الاسم الكامل:</span> أحمد بن علي</div>
          <div><span>المستوى:</span> الثانية باك علوم</div>
          <div><span>المؤسسة:</span> ثانوية ابن خلدون</div>
          <div><span>رقم التلميذ:</span> 2024-1587</div>
        </div>
      </div>

      <!-- النقط -->
      <div class="card">
        <h2>نقط المراقبة المستمرة</h2>
        <table class="grades-table">
          <thead>
            <tr>
              <th>المادة</th>
              <th>الفرض 1</th>
              <th>الفرض 2</th>
              <th>المعدل</th>
            </tr>
          </thead>
          <tbody id="grades-body">
            <!-- سيتم ملؤها بالجافاسكريبت -->
          </tbody>
        </table>
      </div>

      <!-- الغيابات -->
      <div class="card">
        <h2>الغيابات</h2>
        <ul class="absence-list" id="absence-list">
          <!-- سيتم ملؤها بالجافاسكريبت -->
        </ul>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
